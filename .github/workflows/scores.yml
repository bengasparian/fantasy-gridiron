name: Live scores and news

on:
  schedule:
    - cron: "4-59/10 * * * *"   # every 10 minutes (stays under GitHub Pages' 10 site builds per hour); only saves when a score changed
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scores:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refresh live.json and news.json
        run: |
          python live_update.py
          python news_update.py
      - name: Save
        run: |
          git config user.name "gridiron-fantasy-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for f in live.json news.json; do if [ -f "$f" ]; then git add "$f"; fi; done
          git diff --cached --quiet || git commit -m "Live scores $(date -u +%H:%M)"
          git pull --rebase --autostash || true
          git push || true
