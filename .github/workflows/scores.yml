name: Live scores and news

on:
  schedule:
    - cron: "4-59/10 * * * *"   # every 10 minutes (stays under GitHub Pages' 10 site builds per hour); only saves when a score changed
  workflow_dispatch: {}

permissions:
  contents: write

# shares a queue with the data update so the two never save at the same moment
concurrency:
  group: bff-site-data
  cancel-in-progress: false

jobs:
  scores:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refresh live.json and news.json
        run: |
          python live_update.py
          python news_update.py
      - name: Save
        run: |
          git config user.name "gridiron-fantasy-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for f in live.json news.json; do if [ -f "$f" ]; then git add "$f"; fi; done
          if git diff --cached --quiet; then echo "No score changes"; exit 0; fi
          git commit -m "Live scores $(date -u +%H:%M)"
          for i in 1 2 3; do
            if git pull --rebase --autostash && git push; then exit 0; fi
            echo "Save attempt $i did not go through; retrying"; sleep $((i*10))
          done
          echo "Could not save this time; the next run will catch up"; exit 0
