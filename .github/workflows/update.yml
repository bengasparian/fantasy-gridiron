name: Update Gridiron Fantasy

on:
  schedule:
    - cron: "23 */6 * * *"   # every 6 hours, at 23 minutes past (the top of the hour is GitHub's busiest time)
  workflow_dispatch: {}

permissions:
  contents: write

# the score job and this job share one queue, so they never save at the same moment
concurrency:
  group: bff-site-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install libraries
        run: pip install pandas pyarrow scikit-learn scipy
      - name: Download data
        run: python fetch_data.py 2026
      - name: Build projections
        run: python ff_produce.py
      - name: Sync Sleeper league (optional)
        env:
          SLEEPER_LEAGUE_ID: ${{ vars.SLEEPER_LEAGUE_ID }}
        run: python sync_sleeper.py
      - name: Track suggested parlays
        run: python parlay_update.py
      - name: Build the page
        run: python assemble.py
      - name: Save the updated page
        run: |
          git config user.name "gridiron-fantasy-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html proj_history.json parlay_history.json
          if git diff --cached --quiet; then echo "No changes to save"; exit 0; fi
          git commit -m "Data update $(date -u +%F)"
          for i in 1 2 3; do
            if git pull --rebase --autostash && git push; then exit 0; fi
            echo "Save attempt $i did not go through; retrying"; sleep $((i*15))
          done
          exit 1
